name: Päivitä ja julkaise

on:
  schedule:
    # GitHubin ajat ovat UTC-aikaa. Suomen talviaika = UTC+2, kesäaika = UTC+3.
    # Otteluiden aikaan (n. klo 0–9 Suomen aikaa) 10 minuutin välein:
    - cron: "*/10 22,23 * * *"
    - cron: "*/10 0-7 * * *"
    # Muulloin kerran tunnissa (otteluohjelma, tilastot):
    - cron: "17 8-21 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kiekkoaamu
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hae tiedot ja rakenna sivusto
        run: python scripts/build.py

      - name: Tallenna arkisto ja historia
        run: |
          git config user.name "kiekkoaamu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Päivitä data $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash || true
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
