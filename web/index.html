<style>
:root{
  --bg:#0b1118; --panel:#121b25; --panel2:#17222e; --line:#223040;

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45;min-height:100vh}
a{color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:0 14px 60px}
header{padding:22px 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:31px;letter-spacing:.6px;line-height:1}
.brand img{filter:drop-shadow(0 0 10px rgba(240,40,46,.45))}

nav{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent);padding:8px 0 12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;text-decoration:none;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16.5px;letter-spacing:.4px;text-transform:uppercase;padding:7px 13px;border-radius:999px;background:var(--panel);color:var(--mute);border:1px solid var(--line)}
nav a.on{background:var(--lamp);color:#fff;border-color:var(--lamp)}

.notice{background:linear-gradient(135deg,#0f2a52,#123a6b);border:1px solid #2a5596;border-radius:14px;padding:12px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center}
.flag{width:30px;height:20px;flex:0 0 auto;border-radius:3px;background:#fff;position:relative;overflow:hidden;display:inline-block;vertical-align:middle}
.flag:before{content:"";position:absolute;left:8px;top:0;bottom:0;width:5px;background:var(--fi)}
.flag:after{content:"";position:absolute;top:7.5px;left:0;right:0;height:5px;background:var(--fi)}
.notice b{display:block;font-size:14px}

h2{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.4px;margin:6px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 14px 10px;gap:8px}

.team.h{flex-direction:row-reverse;text-align:right}

.note{padding:0 14px 8px;color:#c7d3e0;font-size:13px}
details{border-top:1px solid var(--line)}

.goals{padding:0 14px 12px;font-size:13.5px}
.goal{display:grid;grid-template-columns:44px 42px 1fr;gap:6px;padding:4px 0;border-bottom:1px dashed #1d2a38}

.gk{color:var(--mute);font-size:12.5px;margin-top:6px}
.hl{display:flex;gap:8px;padding:0 14px 14px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:600;font-size:14px;padding:11px 12px;border-radius:12px;background:var(--accent);color:#fff}
.btn svg{width:18px;height:18px;flex:0 0 auto}

.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:11px 14px 9px;background:var(--panel2);border-bottom:1px solid var(--line)}
.dayh b{font-family:"Barlow Condensed",sans-serif;font-size:18px;text-transform:uppercase;letter-spacing:.4px}
.dayh small{color:var(--mute);font-size:12px}
.urow{display:grid;grid-template-columns:58px 1fr;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:10px}
.urow:last-child{border-bottom:0}
.urow .tm{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;color:var(--ice);line-height:1}

.mu{display:flex;flex-direction:column;gap:5px;min-width:0}
.mu .side{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}

.mu .side span.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}

.venue{font-size:11.5px;color:#ffd27a}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl h3{font-family:"Barlow Condensed",sans-serif;font-size:17px;text-transform:uppercase;letter-spacing:.5px;padding:10px 14px 4px;color:var(--ice)}
th{color:var(--mute);font-weight:500;font-size:11.5px;text-align:right;padding:6px 6px;text-transform:uppercase}
td{text-align:right;padding:7px 6px;border-top:1px solid #1b2733}

th:last-child,td:last-child{padding-right:14px}

.nm-cell .txt small{display:block;color:var(--mute);font-size:11px}
.mini{display:inline-grid;place-items:center;width:30px;height:21px;border-radius:5px;font-size:10.5px;font-weight:800;color:#fff;font-family:"Barlow Condensed",sans-serif;flex:0 0 auto}
tr.cut td{border-top:2px solid #35506b}
.pos{color:#6fe3a1}.neg{color:#ff8a94}
.legend{color:var(--mute);font-size:12px;margin:-4px 0 14px}
.src{margin-top:28px;color:var(--mute);font-size:12px}
.src a{color:var(--mute)}
.src li{margin:3px 0 3px 16px}
.empty{color:var(--mute);padding:18px 14px;text-align:center}
.view{display:none}.view.on{display:block}
.fihero{background:linear-gradient(135deg,#ffffff 0%,#e8efff 100%);color:#0b2b66;border-radius:16px;padding:14px;margin-bottom:12px;display:flex;gap:12px;align-items:center}
.fihero .big{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:34px;line-height:1;color:var(--fi)}
.fihero .lbl{font-size:12.5px;color:#3b5a99}
.fistats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.fistat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.fistat b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:26px;line-height:1.1}
.fistat small{color:var(--mute);font-size:11.5px}
.night{padding:4px 14px 10px}
.night .row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #1d2a38;font-size:14px}
.night .row:last-child{border-bottom:0}
.night .row em{font-style:normal;color:var(--mute);font-size:12px;margin-left:auto}
.teamcard .th{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.teamcard .th b{font-size:15px}
.teamcard .th small{color:var(--mute);font-size:12px;margin-left:auto}
.na{color:var(--mute)}
button.btn{border:0;font:inherit;font-weight:600;cursor:pointer}
.ytwrap{padding:0 14px 12px}.yt16{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.yt16 iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.ytsrc{font-size:11.5px;color:var(--mute);margin-top:5px}
h1.sub{font:inherit;font-size:13px;color:var(--mute);margin-top:4px;font-weight:400}
.favbar{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:13px;color:var(--mute)}
.favbar select{font:inherit;font-size:13.5px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 8px;flex:1;min-width:0}
.card.fav{border-color:#ffd27a;box-shadow:0 0 0 1px #ffd27a inset}
tr.fav td{background:rgba(255,210,122,.09)}
.urow.fav{background:rgba(255,210,122,.07)}
.star{font-size:11px;color:#ffd27a;margin-left:6px}
.stars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;min-width:0}
.st .n{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:20px;color:#ffd27a;line-height:1}
.st b{display:block;font-size:13px;margin-top:6px;line-height:1.2}
.st small{display:block;color:var(--mute);font-size:11.5px;margin-top:3px}
.pend{border-style:dashed}
.pend .fin{color:#ffd27a}
.pg{font-size:11.5px;color:#c7d3e0}
.pg b{color:var(--ice);font-weight:600}
.alert{background:var(--panel2);border:1px solid var(--line);border-left:3px solid #ffd27a;border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:13px}
.alert li{margin-left:16px}
.chart{padding:6px 10px 12px}
.chart svg{width:100%;height:auto;display:block}
.lg{display:flex;flex-wrap:wrap;gap:6px 12px;padding:0 14px 12px;font-size:12px;color:#c7d3e0}
.lg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

@media (max-width:420px){nav{gap:4px}nav a{font-size:14.5px;padding:6px 10px}.nums{font-size:30px}.badge{width:36px;height:36px;font-size:13px}.tn b{font-size:13.5px}th.hide,td.hide{display:none}.score{padding:12px 10px 8px}}
</style>

<body>
<div class="wrap">
  <header>
    <div>
      <a class="brand" href="/" aria-label="Kiekkotulokset – etusivu"><img src="/logo-mark.svg" alt="" width="34" height="34"><span>KIEKKO<b>TULOKSET</b></span></a>
      <h1 class="sub">{{TAGLINE}}</h1>
    </div>
    <div class="upd" id="upd"></div>
  </header>
  <nav id="nav">
    <a href="#tulokset" data-v="tulokset">Tulokset</a>
    <a href="#ohjelma" data-v="ohjelma">Tulevat ottelut</a>
    <a href="#suomalaiset" data-v="suomalaiset" class="fi-tab">🇫🇮 Suomalaiset</a>
    <a href="#porssi" data-v="porssi">Pistepörssi</a>
    <a href="#sarjataulukko" data-v="sarjataulukko">Sarjataulukko</a>
  </nav>
  <div class="favbar"><span>⭐ Oma joukkue</span><select id="fav"></select></div>
  <div id="notice"></div>
  <section class="view on" id="v-tulokset">{{SSR}}</section>
  <section class="view" id="v-ohjelma"></section>
  <section class="view" id="v-suomalaiset"></section>
  <section class="view" id="v-porssi"></section>
  <section class="view" id="v-sarjataulukko"></section>
  <div class="src" id="src"></div>
  <div class="src">{{FOOTER}}</div>
</div>
<script>
// [koko nimi, lempinimi (YouTube-otsikoissa), väri]
const TEAMS={
 ANA:["Anaheim Ducks","Ducks","#F47A38"],BOS:["Boston Bruins","Bruins","#B8860B"],BUF:["Buffalo Sabres","Sabres","#003087"],
 CAR:["Carolina Hurricanes","Hurricanes","#CE1126"],CBJ:["Columbus Blue Jackets","Blue Jackets","#002654"],CGY:["Calgary Flames","Flames","#C8102E"],
 CHI:["Chicago Blackhawks","Blackhawks","#CF0A2C"],COL:["Colorado Avalanche","Avalanche","#6F263D"],DAL:["Dallas Stars","Stars","#006847"],
 DET:["Detroit Red Wings","Red Wings","#CE1126"],EDM:["Edmonton Oilers","Oilers","#FF4C00"],FLA:["Florida Panthers","Panthers","#C8102E"],
 LAK:["Los Angeles Kings","Kings","#3a3a3a"],MIN:["Minnesota Wild","Wild","#154734"],MTL:["Montréal Canadiens","Canadiens","#AF1E2D"],
 NJD:["New Jersey Devils","Devils","#CE1126"],NSH:["Nashville Predators","Predators","#B8860B"],NYI:["New York Islanders","Islanders","#00539B"],
 NYR:["New York Rangers","Rangers","#0038A8"],OTT:["Ottawa Senators","Senators","#C52032"],PHI:["Philadelphia Flyers","Flyers","#F74902"],
 PIT:["Pittsburgh Penguins","Penguins","#9c7c0c"],SEA:["Seattle Kraken","Kraken","#00837a"],SJS:["San Jose Sharks","Sharks","#006D75"],
 STL:["St. Louis Blues","Blues","#002F87"],TBL:["Tampa Bay Lightning","Lightning","#002868"],TOR:["Toronto Maple Leafs","Maple Leafs","#00205B"],
 UTA:["Utah Mammoth","Mammoth","#4a8fc4"],VAN:["Vancouver Canucks","Canucks","#00205B"],VGK:["Vegas Golden Knights","Golden Knights","#8a7a4f"],
 WPG:["Winnipeg Jets","Jets","#041E42"],WSH:["Washington Capitals","Capitals","#C8102E"]
};
const T=a=>TEAMS[a]||[a,a,"#445"];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const badge=a=>`<div class="badge" style="background:${T(a)[2]}" title="${esc(T(a)[0])}">${esc(a)}</div>`;
const mini=a=>`<span class="mini" style="background:${T(a)[2]}" title="${esc(T(a)[0])}">${esc(a)}</span>`;
const num=v=>v==null?'<span class="na">–</span>':v;
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const YT_ICON='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .6 12 31 31 0 0 0 1 16.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8zM9.7 15.1V8.9l5.8 3.1-5.8 3.1z"/></svg>';
let FAV="";try{FAV=localStorage.getItem("nhlaamu-fav")||""}catch(e){}
const isFav=(...t)=>FAV&&t.includes(FAV);
let D=null, FINN=new Set(), FINN_LAST=new Map(), FINN_BY_TEAM={};

function ytLink(g){
  const [y,m,d]=D.gameDate.split("-");
  const q=`NHL Highlights | ${T(g.away)[1]} vs. ${T(g.home)[1]} | ${MONTHS[+m-1]} ${d}, ${y}`;
  return "https://www.youtube.com/results?search_query="+encodeURIComponent(q);
}
function playVid(btn){
  const card=btn.closest(".card"); if(!card||card.querySelector(".ytwrap")) return;
  const w=document.createElement("div"); w.className="ytwrap";
  w.innerHTML=`<div class="yt16"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(btn.dataset.vid)}?autoplay=1&rel=0" title="Maalikooste – NHL / YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div><div class="ytsrc">Video: NHL / YouTube</div>`;
  btn.closest(".hl").after(w);
}
function isFinn(name,team){
  if(!name) return false;
  if(FINN.has(name)) return true;
  const last=name.trim().split(/\s+/).pop();
  const t=FINN_LAST.get(last);
  return !!t && (!team || t.has(team));
}
const plink=n=>{const sl=D&&D.finnSlugs&&D.finnSlugs[n];return sl?`<a href="/suomalaiset/${esc(sl)}.html" style="text-decoration:none">${esc(n)}</a>`:esc(n);};
const fiBadge=(n,t)=>isFinn(n,t)?'<span class="fi">FIN</span>':"";
function fiDate(iso,opts){ return new Intl.DateTimeFormat("fi-FI",Object.assign({timeZone:"Europe/Helsinki"},opts)).format(new Date(iso)); }
function dayLabel(ymd,opts){ return new Intl.DateTimeFormat("fi-FI",Object.assign({timeZone:"UTC"},opts)).format(new Date(ymd+"T12:00:00Z")); }
function nightLabel(){
  const d=new Date(D.gameDate+"T12:00:00Z"), n=new Date(d.getTime()+864e5);
  const wd=new Intl.DateTimeFormat("fi-FI",{weekday:"short",timeZone:"UTC"});
  const dm=x=>`${x.getUTCDate()}.${x.getUTCMonth()+1}.`;
  return `Yö ${wd.format(d)}–${wd.format(n)} ${dm(d)}–${dm(n)}`;
}

/* ---------- Tulokset ---------- */
function renderResults(){
  const el=document.getElementById("v-tulokset");
  if(!D.games.length&&!(D.pending||[]).length){el.innerHTML=`<h2>Yön tulokset</h2><div class="card empty">Yöllä ei pelattu NHL-otteluita.</div>`;return;}
  const pend=D.pending||[];
  let h=`<h2>Yön tulokset <small>${esc(nightLabel())} · ${D.games.length+pend.length} ottelua</small></h2>`;
  if(D.stars&&D.stars.length) h+=`<div class="stars">${D.stars.slice(0,3).map((s,i)=>`<div class="st"><div class="n">${"★".repeat(i+1)}</div>${mini(s.team)}<b>${esc(s.name)}${fiBadge(s.name,s.team)}</b><small>${esc(s.line)}</small></div>`).join("")}</div>`;
  const games=D.games.slice().sort((a,b)=>(isFav(b.away,b.home)?1:0)-(isFav(a.away,a.home)?1:0));
  for(const g of pend){
    h+=`<article class="card pend ${isFav(g.away,g.home)?"fav":""}"><div class="score">
      <div class="team">${badge(g.away)}<div class="tn"><b>${esc(T(g.away)[0])}</b><small>vieras</small></div></div>
      <div class="mid"><div class="nums">${g.awayScore??"–"}–${g.homeScore??"–"}</div><div class="fin">${g.status?esc(g.status):"Kesken"}</div></div>
      <div class="team h">${badge(g.home)}<div class="tn"><b>${esc(T(g.home)[0])}</b><small>koti</small></div></div></div>
      ${D.refreshNote&&!/^Alkaa/.test(g.status||"")?`<div class="note">${esc(D.refreshNote)}</div>`:""}</article>`;
  }
  for(const g of games){
    const aw=g.awayScore>g.homeScore;
    const fin=g.final?`Päättyi · ${esc(g.final)}`:"Päättyi";

let progFilter="all";
function renderUpcoming(){
  const el=document.getElementById("v-ohjelma");
  const now=Date.now()-3*3600e3;
  let ups=D.upcoming.filter(u=>new Date(u.start).getTime()>now);
  if(progFilter==="fav") ups=ups.filter(u=>isFav(u.away,u.home));
  if(progFilter==="fin") ups=ups.filter(u=>(FINN_BY_TEAM[u.away]||[]).length||(FINN_BY_TEAM[u.home]||[]).length);
  let h=`<h2>Tulevat ottelut <small>ajat Suomen aikaa</small></h2>
    <div class="seg"><button data-f="all" class="${progFilter==="all"?"on":""}">Kaikki</button><button data-f="fin" class="${progFilter==="fin"?"on":""}">🇫🇮 Suomalaisten ottelut</button>${FAV?`<button data-f="fav" class="${progFilter==="fav"?"on":""}">⭐ ${esc(FAV)}</button>`:""}</div>`;
  const PG=D.pregame||null;
  if(PG&&PG.notes&&PG.notes.length) h+=`<div class="alert"><b>Ennen illan otteluita</b> <span class="na">(${esc(fiDate(PG.updated,{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}))})</span><ul>${PG.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`;
  if(!ups.length){el.innerHTML=h+`<div class="card empty">Ei tulevia otteluita tiedossa.</div>`;bindSeg(el,"f",v=>{progFilter=v;renderUpcoming();});return;}
  const days={};ups.forEach(u=>(days[u.day]=days[u.day]||[]).push(u));
  for(const day of Object.keys(days).sort()){
    const list=days[day].sort((a,b)=>a.start.localeCompare(b.start));
    const [,mm,dd]=day.split("-");
    h+=`<div class="card"><div class="dayh"><b>${esc(dayLabel(day,{weekday:"long"}))} ${+dd}.${+mm}.</b><small>${list.length} ottelua</small></div>`;
    for(const u of list){
      const fiDay=fiDate(u.start,{weekday:"short"});
      const gkInfo=(PG&&PG.goalies)?[u.away,u.home].map(t=>PG.goalies.find(x=>x.team===t&&x.day===u.day)).filter(Boolean):[];
      h+=`<div class="urow ${isFav(u.away,u.home)?"fav":""}"><div class="tm">${esc(fiDate(u.start,{hour:"2-digit",minute:"2-digit"}))}<small>${esc(fiDay)}</small></div>
        <div class="mu">
          <div class="side">${badge(u.away)}<span class="nm">${esc(T(u.away)[0])}</span><em>vieras</em></div>
          <div class="side">${badge(u.home)}<span class="nm">${esc(T(u.home)[0])}</span><em>koti</em></div>
          ${u.venue?`<div class="venue">📍 ${esc(u.venue)}</div>`:""}
          ${gkInfo.length?`<div class="pg">🥅 ${gkInfo.map(x=>`<b>${esc(x.team)}</b> ${esc(x.name)}${fiBadge(x.name,x.team)} <span class="na">(${esc(x.status)})</span>`).join(" · ")}</div>`:""}
          ${(FINN_BY_TEAM[u.away]||[]).length||(FINN_BY_TEAM[u.home]||[]).length?`<div class="chips">${finnChips(u.away)}${finnChips(u.home)}</div>`:""}
        </div></div>`;
    }
    h+=`</div>`;
  }
  h+=`<div class="legend">Päivä = NHL:n pelipäivä Pohjois-Amerikan aikaa; kellonajat Suomen aikaa (yöllä seuraavana päivänä). Siniset nimilaput: joukkueiden suomalaiset (kokoonpanot voivat muuttua). Otteluohjelma voi muuttua.</div>`;

    for(const dv of D.standings) h+=`<div class="card tbl"><h3>${esc(dv.name)} <span style="color:var(--mute)">· ${esc(dv.conf)}</span></h3><table>${head}<tbody>${sortT(dv.teams).map((t,i)=>row(t,i,i===3)).join("")}</tbody></table></div>`;

    for(const c of ["Itä","Länsi"]){
      const divs=D.standings.filter(d=>d.conf===c);
      let rest=[];
      for(const dv of divs){
        const st=sortT(dv.teams);
        h+=`<div class="card tbl"><h3>${esc(dv.name)} · top 3</h3><table>${head}<tbody>${st.slice(0,3).map((t,i)=>row(t,i,false)).join("")}</tbody></table></div>`;

    }

  }else{

  }

  el.innerHTML=h;
  bindSeg(el,"s",v=>{stView=v;renderStandings();});
}

function trendChart(){
  const H=(D.history||[]).slice(-60);
  if(!H.length) return "";
  const head=`<div class="card"><div class="dayh"><b>Kauden kehitys</b><small>suomalaisten pisteet</small></div>`;
  if(H.length<2) return head+`<div class="night"><div class="row na">Käyrä alkaa piirtyä, kun päivityksiä on kertynyt useammalta päivältä. Tänään yhteensä ${H[0].total} pistettä.</div></div></div>`;
  const W=340,Hh=150,pl=30,pr=8,pt=10,pb=22;
  const names=Object.keys(H[H.length-1].players||{}).slice(0,5);
  const cols=["#7fd3ff","#ffd27a","#ff8a94","#6fe3a1","#c9a7ff"];
  const maxTot=Math.max(...H.map(x=>x.total)),maxP=Math.max(1,...H.flatMap(x=>Object.values(x.players||{})));
  const X=i=>pl+(W-pl-pr)*i/(H.length-1);
  const path=(vals,max)=>vals.map((v,i)=>v==null?"":`${i&&vals[i-1]!=null?"L":"M"}${X(i).toFixed(1)},${(pt+(Hh-pt-pb)*(1-v/max)).toFixed(1)}`).join("");
  const dl=x=>{const[,m,d]=x.date.split("-");return `${+d}.${+m}.`};
  let svg=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Suomalaisten pistekehitys">`;
  for(let k=0;k<=2;k++){const y=pt+(Hh-pt-pb)*k/2;svg+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#223040"/><text x="${pl-5}" y="${y+4}" fill="#8a9bb0" font-size="10" text-anchor="end">${Math.round(maxP*(1-k/2))}</text>`;}
  names.forEach((n,j)=>{svg+=`<path d="${path(H.map(x=>(x.players||{})[n]??null),maxP)}" fill="none" stroke="${cols[j]}" stroke-width="2" stroke-linejoin="round"/>`;});
  svg+=`<text x="${pl}" y="${Hh-6}" fill="#8a9bb0" font-size="10">${dl(H[0])}</text><text x="${W-pr}" y="${Hh-6}" fill="#8a9bb0" font-size="10" text-anchor="end">${dl(H[H.length-1])}</text></svg>`;
  const first=H[0].total,last=H[H.length-1].total;
  return head+`<div class="chart">${svg}</div><div class="lg">${names.map((n,j)=>`<span><i style="background:${cols[j]}"></i>${esc(n.split(" ").pop())} ${H[H.length-1].players[n]}</span>`).join("")}<span class="na">Yhteensä ${last} p (+${last-first} jaksolla)</span></div></div>`;
}

}
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0);});

async function init(){
  try{ const r=await fetch("data.json",{cache:"no-store"}); D=await r.json(); }
  catch(e){ document.getElementById("v-tulokset").innerHTML='<div class="card empty">Tietojen lataus epäonnistui. Päivitä sivu.</div>'; route(); return; }
  FINN=new Set(D.finnNames||[]);
  for(const p of [...(D.finns||[]),...(D.finnGoalies||[])]){
    const last=p[0].split(" ").pop();
    if(!FINN_LAST.has(last)) FINN_LAST.set(last,new Set());
    FINN_LAST.get(last).add(p[1]);
    (FINN_BY_TEAM[p[1]]=FINN_BY_TEAM[p[1]]||[]).push(p[0]);
  }
  document.getElementById("upd").innerHTML="Päivitetty<br>"+esc(fiDate(D.updated,{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}));
  if(D.notice) document.getElementById("notice").innerHTML=`<div class="notice"><span class="flag"></span><div><b>${esc(D.notice.title)}</b><small>${esc(D.notice.text)}</small></div></div>`;
  initFav(); renderAll();
  document.getElementById("src").innerHTML="Tiedot:<ul>"+(D.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a></li>`).join("")+"</ul>";
  route();
}
init();
</script>
